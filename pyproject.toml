[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localrecall"
version = "0.1.0"
description = "Private, event-sourced visual memory for a bounded workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gradio==5.49.1",
  "httpx==0.28.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.11.0.86",
  "Pillow==11.3.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-dotenv==1.2.4",
  "rapidfuzz==3.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.17.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

